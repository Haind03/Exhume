name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: Tests without the YARA engine
        run: cargo test --no-default-features

  release-musl:
    name: static musl binary
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Check the binary is static
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/exhume
          file "$BIN"
          file "$BIN" | grep -Eq 'static(-pie)? linked'
          "$BIN" --version
      - name: Smoke run (unprivileged and root)
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/exhume
          set +e
          "$BIN" --no-color --quiet --json out-user.json; rc=$?
          echo "unprivileged exit code: $rc"; [ $rc -eq 0 ] || [ $rc -eq 2 ] || exit 1
          sudo "$BIN" --no-color --quiet --json out-root.json --html report.html; rc=$?
          echo "root exit code: $rc"; [ $rc -eq 0 ] || [ $rc -eq 2 ] || exit 1
          python3 -c "import json; r=json.load(open('out-root.json')); print(r['processes_scanned'], 'processes,', len(r['findings']), 'findings')"
      - name: Package
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/exhume dist/exhume-x86_64-linux-musl
          cd dist && sha256sum exhume-x86_64-linux-musl > exhume-x86_64-linux-musl.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: exhume-x86_64-linux-musl
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
