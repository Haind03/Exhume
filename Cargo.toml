[package]
name = "exhume"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
authors = ["HaiND from the Post and Telecommunication Institute of Technology <haind@ptit.edu.vn>"]
description = "Live Linux threat hunting for incident responders: fileless implants, injected code, rootkits, stealthy persistence and backdoor sockets, MITRE ATT&CK mapped"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Haind03/Exhume"
repository = "https://github.com/Haind03/Exhume"
keywords = ["dfir", "threat-hunting", "linux", "rootkit", "incident-response"]
categories = ["command-line-utilities"]
exclude = ["/.github"]

[[bin]]
name = "exhume"
path = "src/main.rs"

[features]
default = ["yara"]
# YARA scanning of suspicious memory regions and persistence targets (pure Rust engine, yara-x).
yara = ["dep:yara-x"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
libc = "0.2"
md-5 = "0.11"
sha2 = "0.10"
yara-x = { version = "1", optional = true, default-features = false, features = [
    "constant-folding",
    "exact-atoms",
    "fast-regexp",
    "elf-module",
    "pe-module",
    "hash-module",
    "math-module",
    "string-module",
    "time-module",
    "console-module",
] }

[build-dependencies]
# Same engine, same features: rules are compiled at build time (build.rs) and deserialized at run time.
yara-x = { version = "1", optional = true, default-features = false, features = [
    "constant-folding",
    "exact-atoms",
    "fast-regexp",
    "elf-module",
    "pe-module",
    "hash-module",
    "math-module",
    "string-module",
    "time-module",
    "console-module",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Compile the rule set at build time with an optimized engine.
[profile.release.build-override]
opt-level = 3
